      - "<click_info>Sneak+Right click<passive> to copy / clear the channel"
  NTW_EXPANSION_OVERCLOCK_CORE:
    name: "Overclock Core"
    lore:
      - "<passive>Unlocks full-load speed for assembly drives"
      - ""
      - "<click_info>Insert into the upgrade slot<passive> to activate"
  NTW_EXPANSION_SMART_CORE:
    name: "Smart Core"
    lore:
      - "<passive>Includes bound channel stock when checking replenishment"
      - ""
